plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.119'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.ALL
}

version = "${mod_version}-neoforge+mc${minecraft_version}"
group = mod_group_id

repositories {
    flatDir { dirs 'libs' }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ModDevGradle identifies bound source sets by name. Both projects have a
// source set called "main", so expose the engine classes through a uniquely
// named proxy source set for development launches.
sourceSets {
    embeddedEngine {
        // Compile the same dependency-free sources into this project's
        // conventional output directory, which ModDev mounts into the module.
        java.srcDir project(':engine').file('src/main/java')
        java.srcDir project(':mateengine').file('src/main/java')
        resources.setSrcDirs([])
    }
    selfTest {
        java.srcDir 'src/selfTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // Development runs load source-set outputs directly instead of the
            // assembled JAR, so bind the standalone engine output to this mod too.
            sourceSet(sourceSets.embeddedEngine)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    selfTestImplementation.extendsFrom implementation
    selfTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation project(':engine')
    implementation project(':mateengine')
    implementation files("libs/touhoulittlemaid-1.4.5-neoforge+mc1.21.1-all.jar")
}

// The engine remains independently testable, but its pure-Java classes and
// Sunfish data files must also be present in the distributable mod JAR.
tasks.named('processResources', ProcessResources).configure {
    from(layout.projectDirectory.dir('tem')) {
        include 'eval.bin'
        include 'book.bin'
        into 'assets/tlm_shogi/sunfish'
    }

    // Do not ship the superseded Windows-only YaneuraOu executable and NNUE data.
    exclude 'assets/tlm_shogi/shogi_engine/**'
}

tasks.named('jar', Jar).configure {
    dependsOn project(':engine').tasks.named('classes')
    dependsOn project(':mateengine').tasks.named('classes')
    from(project(':engine').sourceSets.main.output)
    from(project(':mateengine').sourceSets.main.output)
}

tasks.register('verifyDistributableJar', JavaExec) {
    group = 'verification'
    description = 'Loads resources from the built mod JAR and performs one pure-Java engine search.'
    dependsOn tasks.named('jar')
    classpath = files(tasks.named('jar', Jar).flatMap { it.archiveFile })
    mainClass = 'com.github.sangeeeee.tlm_shogi.engine.tool.BundledEngineSmoke'
    maxHeapSize = '512m'
}

tasks.register('microcosmosGameplayTest', JavaExec) {
    group = 'verification'
    description = 'Replays Microcosmos through the Minecraft board-position implementation.'
    dependsOn selfTestClasses
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'com.github.sangeeeee.tlm_shogi.tsume.MicrocosmosGameplaySelfTest'
    args(layout.projectDirectory.file('src/main/resources/data/tlm_shogi/tsume/microcosmos.usi'))
}

tasks.register('handSelectionGeometryTest', JavaExec) {
    group = 'verification'
    description = 'Verifies the hand-piece picking footprint and gaps.'
    dependsOn selfTestClasses
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'com.github.sangeeeee.tlm_shogi.util.HandSelectionGeometrySelfTest'
}

tasks.register('jChessUiAdapterTest', JavaExec) {
    group = 'verification'
    description = 'Verifies the stateless adapter between the shogi engine and Minecraft UI.'
    dependsOn selfTestClasses
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'com.github.sangeeeee.tlm_shogi.util.JChessUiAdapterSelfTest'
}

tasks.named('check') {
    dependsOn microcosmosGameplayTest
    dependsOn handSelectionGeometryTest
    dependsOn jChessUiAdapterTest
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
