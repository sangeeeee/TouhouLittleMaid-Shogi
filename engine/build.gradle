plugins {
    id 'java-library'
}

group = 'com.github.sangeeeee.tlm_shogi'
version = rootProject.version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    selfTest {
        java.srcDir 'src/selfTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations {
    selfTestImplementation.extendsFrom implementation
    selfTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('engineTest', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free engine tests without launching Minecraft.'
    dependsOn selfTestClasses
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'com.github.sangeeeee.tlm_shogi.engine.EngineSelfTest'
}

tasks.register('enginePerft', JavaExec) {
    group = 'verification'
    description = 'Runs a start-position perft benchmark without launching Minecraft.'
    dependsOn selfTestClasses
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'com.github.sangeeeee.tlm_shogi.engine.EnginePerft'
    args((findProperty('perftDepth') ?: '4').toString())
}

tasks.register('engineSearch', JavaExec) {
    group = 'verification'
    description = 'Runs one eval.bin-backed Java search without launching Minecraft.'
    dependsOn selfTestClasses
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'com.github.sangeeeee.tlm_shogi.engine.EngineSearch'
    args(
            rootProject.layout.projectDirectory.dir('tem').asFile.absolutePath,
            (findProperty('searchDepth') ?: '5').toString(),
            (findProperty('searchMillis') ?: '3000').toString(),
            (findProperty('searchNodes') ?: '30000').toString(),
            (findProperty('searchSfen') ?: 'startpos').toString()
    )
}

tasks.register('probeSunfishResources', JavaExec) {
    group = 'verification'
    description = 'Validates tem/eval.bin and tem/book.bin without launching Minecraft.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.sangeeeee.tlm_shogi.engine.tool.SunfishResourceProbe'
    args rootProject.layout.projectDirectory.dir('tem').asFile.absolutePath
}

tasks.named('check') {
    dependsOn engineTest
}
